[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operating-memory"
version = "0.1.0"
description = "A local, markdown-first memory core"
requires-python = ">=3.11"

[project.scripts]
om = "operating_memory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
